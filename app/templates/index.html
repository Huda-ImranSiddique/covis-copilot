<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COVIS AI Copilot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app">
        <!-- LEFT: Orb panel -->
        <section class="orb-panel">
            <div class="brand">
                <h1>COVIS AI Copilot</h1>
                <p class="sub">Event Management Assistant</p>
            </div>

            <div class="orb-wrap">
                <div class="orb" id="orb">
                    <div class="orb-shell"></div>
                    <div class="orb-shell-2"></div>
                    <div class="orb-shell-3"></div>
                    <div class="orb-shell-4"></div>
                    <div class="orb-core"></div>
                </div>
            </div>

            <div class="controls">
                <div class="status" id="status">Starting...</div>
                <button id="mic-btn" class="mic-big" title="Speak">🎤</button>
                <label class="continuous-toggle">
                    <input type="checkbox" id="continuous-toggle">
                    <span>Hands-free</span>
                </label>
            </div>
        </section>

        <!-- RIGHT: Chat panel -->
        <section class="chat-panel">
            <header class="chat-header">
                <span class="dot"></span>
                <span>Live Conversation</span>
                <button id="clear-btn" class="clear-btn">Clear</button>
            </header>

            <main class="chat" id="chat">
                <div class="message assistant">
                    <div class="bubble">
                        Hi! I'm COVIS. Tap the mic and ask me anything about your team, tasks, events, or leads.
                    </div>
                </div>
            </main>

            <div class="quick-actions">
                <button class="chip" data-q="What is my team plan today?">Team plan</button>
                <button class="chip" data-q="Who can handle the Al-Faisal wedding catering issue?">Wedding catering</button>
                <button class="chip" data-q="What events are happening in Riyadh next week?">Riyadh events</button>
                <button class="chip" data-q="What proposals are currently in review?">Proposals in review</button>
            </div>

            <footer class="input-bar">
                <input
                    type="text"
                    id="message-input"
                    placeholder="Or type a message..."
                    autocomplete="off"
                >
                <button id="send-btn" class="send">Send</button>
            </footer>
        </section>
    </div>

    <script>
        const chatEl = document.getElementById("chat");
        const inputEl = document.getElementById("message-input");
        const sendBtn = document.getElementById("send-btn");
        const micBtn = document.getElementById("mic-btn");
        const statusEl = document.getElementById("status");
        const clearBtn = document.getElementById("clear-btn");
        const orb = document.getElementById("orb");
        const continuousToggle = document.getElementById("continuous-toggle");

        let listening = false;
        let speaking = false;
        let processing = false;
        let recognition = null;
        let silenceTimer = null;
        let accumulatedTranscript = "";

        function setOrbState(state) {
            orb.classList.remove("listening", "thinking", "speaking");
            if (state) orb.classList.add(state);
        }

        function scrollToBottom() {
            chatEl.scrollTop = chatEl.scrollHeight;
        }

        function addMessage(role, text) {
            const wrap = document.createElement("div");
            wrap.className = "message " + role;
            const bubble = document.createElement("div");
            bubble.className = "bubble";
            bubble.textContent = text;
            wrap.appendChild(bubble);
            chatEl.appendChild(wrap);
            requestAnimationFrame(scrollToBottom);
            return bubble;
        }

        async function sendMessage(text) {
            if (!text || !text.trim()) return;

            if (recognition && listening) {
                try { recognition.stop(); } catch (e) {}
            }

            processing = true;
            accumulatedTranscript = "";

            addMessage("user", text);

            const thinking = addMessage("assistant", "Thinking...");
            thinking.classList.add("thinking");
            statusEl.textContent = "Thinking...";
            setOrbState("thinking");

            try {
                const res = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text }),
                });
                const data = await res.json();
                console.log("AI reply:", data.reply);

                thinking.classList.remove("thinking");
                thinking.textContent = data.reply || "(empty response — try again)";
                scrollToBottom();

                speak(data.reply);
            } catch (err) {
                thinking.classList.remove("thinking");
                thinking.textContent = "Error: " + err.message;
                statusEl.textContent = "Error";
                setOrbState(null);
                processing = false;
            }
        }

        sendBtn.addEventListener("click", () => {
            const text = inputEl.value;
            inputEl.value = "";
            sendMessage(text);
        });

        inputEl.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                const text = inputEl.value;
                inputEl.value = "";
                sendMessage(text);
            }
        });

        document.querySelectorAll(".chip[data-q]").forEach((btn) => {
            btn.addEventListener("click", () => {
                sendMessage(btn.getAttribute("data-q"));
            });
        });

        clearBtn.addEventListener("click", () => {
            chatEl.innerHTML = "";
            addMessage("assistant", "Chat cleared. Tap the mic and ask me anything.");
        });

        // ---------- Voice input ----------
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        function startListening() {
            if (!recognition || listening || processing || speaking) return;
            accumulatedTranscript = "";
            try { recognition.start(); } catch (e) {}
        }

        function flushTranscript() {
            const text = accumulatedTranscript.trim();
            accumulatedTranscript = "";
            if (text) {
                sendMessage(text);
            } else {
                if (continuousToggle.checked) {
                    setTimeout(startListening, 500);
                } else {
                    statusEl.textContent = "Tap the mic to speak";
                    setOrbState(null);
                }
            }
        }

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = "en-US";
            recognition.maxAlternatives = 1;

            micBtn.addEventListener("click", () => {
                if (speaking) {
                    window.speechSynthesis.cancel();
                    speaking = false;
                }
                if (listening) {
                    try { recognition.stop(); } catch (e) {}
                } else {
                    startListening();
                }
            });

            recognition.onstart = () => {
                listening = true;
                micBtn.classList.add("listening");
                statusEl.textContent = "Listening...";
                setOrbState("listening");
            };

            recognition.onresult = (event) => {
                let interim = "";
                let final = "";

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        final += transcript + " ";
                    } else {
                        interim += transcript;
                    }
                }

                if (final) {
                    accumulatedTranscript += final;
                }

                statusEl.textContent = "Listening... " + (accumulatedTranscript + interim).slice(-40);

                if (silenceTimer) clearTimeout(silenceTimer);

                if (accumulatedTranscript) {
                    silenceTimer = setTimeout(() => {
                        try { recognition.stop(); } catch (e) {}
                    }, 2000);
                }
            };

            recognition.onend = () => {
                listening = false;
                micBtn.classList.remove("listening");
                if (silenceTimer) {
                    clearTimeout(silenceTimer);
                    silenceTimer = null;
                }
                flushTranscript();
            };

            recognition.onerror = (event) => {
                if (event.error === "no-speech" || event.error === "aborted") return;
                statusEl.textContent = "Mic error: " + event.error;
                listening = false;
                micBtn.classList.remove("listening");
                setOrbState(null);
            };

            window.addEventListener("load", async () => {
                try {
                    await navigator.mediaDevices.getUserMedia({ audio: true });
                    statusEl.textContent = "Tap the mic to speak";
                    if (continuousToggle.checked) {
                        setTimeout(startListening, 800);
                    }
                } catch (e) {
                    statusEl.textContent = "Allow microphone access to speak";
                }
            });

        } else {
            micBtn.addEventListener("click", () => {
                statusEl.textContent = "Voice input needs Chrome or Edge";
            });
            micBtn.style.opacity = "0.4";
        }

        // ---------- Voice output ----------
        function speak(text) {
            if (!("speechSynthesis" in window)) {
                processing = false;
                return;
            }

            if (recognition && listening) {
                try { recognition.stop(); } catch (e) {}
            }

            const clean = (text || "")
                .replace(/[*_`#>]/g, "")
                .replace(/\s+/g, " ")
                .trim();

            if (!clean) {
                processing = false;
                if (continuousToggle.checked) {
                    setTimeout(startListening, 800);
                }
                return;
            }

            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(clean);
            utter.rate = 1.05;
            utter.pitch = 1.0;
            utter.lang = "en-US";

            const voices = window.speechSynthesis.getVoices();
            const preferred = voices.find(v =>
                /Google US English|Microsoft Aria|Microsoft Zira|Samantha/i.test(v.name)
            );
            if (preferred) utter.voice = preferred;

            utter.onstart = () => {
                speaking = true;
                setOrbState("speaking");
                statusEl.textContent = "Speaking...";
            };

            utter.onend = () => {
                speaking = false;
                processing = false;
                setOrbState(null);

                if (continuousToggle.checked && recognition) {
                    statusEl.textContent = "Listening...";
                    setTimeout(startListening, 1200);
                } else {
                    statusEl.textContent = "Tap the mic to speak";
                }
            };

            window.speechSynthesis.speak(utter);
        }

        window.speechSynthesis.onvoiceschanged = () => {};
    </script>
</body>
</html>
